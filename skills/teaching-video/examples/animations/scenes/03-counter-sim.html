<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Counter and simulation</title>
  <link rel="stylesheet" href="../../../theme.css">
</head>
<body>
  <main class="stage">
    <h1 class="in rise" style="--at: var(--b0)">Counter and simulation</h1>
    <div class="cols grow">
      <div>
        <p class="kicker">requests served</p>
        <p class="big c2" id="count">0</p>
      </div>
      <canvas id="sim" width="640" height="480" class="in" style="--at: var(--b1)"></canvas>
    </div>
  </main>
  <script>
    const count = document.getElementById("count");
    const ctx = document.getElementById("sim").getContext("2d");
    const ease = (x) => 1 - (1 - x) ** 3;
    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    let shownCount = null;
    let drawnAngle = null;

    window.renderAt = (t, beats) => {
      const value = Math.round(1000 * ease(clamp01((t - beats[0]) / 2)));
      // Small-angle pendulum: the angle is a closed-form function of time, so any frame can be drawn alone.
      const swing = Math.max(0, t - beats[1]);
      const angle = 0.6 * Math.cos(2 * Math.PI * swing / 1.6) * Math.exp(-0.15 * swing);
      if (value === shownCount && angle === drawnAngle) return false;
      shownCount = value;
      drawnAngle = angle;

      count.textContent = value.toLocaleString("en-US");

      ctx.clearRect(0, 0, 640, 480);
      const pivotX = 320, pivotY = 40, length = 340;
      const bobX = pivotX + length * Math.sin(angle);
      const bobY = pivotY + length * Math.cos(angle);
      ctx.strokeStyle = "#9aa5bc";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(pivotX, pivotY);
      ctx.lineTo(bobX, bobY);
      ctx.stroke();
      ctx.fillStyle = "#4cc9f0";
      ctx.beginPath();
      ctx.arc(bobX, bobY, 40, 0, 2 * Math.PI);
      ctx.fill();
    };
  </script>
</body>
</html>
