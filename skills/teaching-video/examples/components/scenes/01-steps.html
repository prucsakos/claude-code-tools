<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Step list</title>
  <link rel="stylesheet" href="../../../theme.css">
</head>
<body>
  <main class="stage">
    <h1 class="in rise" style="--at: var(--b0)">Import a CSV file</h1>
    <ol class="steps">
      <li style="--at: var(--b0); --until: var(--b1)">Read the input file</li>
      <li style="--at: var(--b1); --until: var(--b2)">Parse every line into a record</li>
      <li style="--at: var(--b2)">Write the records to the database</li>
    </ol>
  </main>
</body>
</html>
