<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Compare card</title>
  <link rel="stylesheet" href="../../../theme.css">
</head>
<body>
  <main class="stage">
    <h1 class="in rise" style="--at: var(--b0)">Do more threads mean more speed?</h1>
    <div class="compare grow">
      <div class="side bad" style="--at: var(--b0)">
        <p class="label">Misconception</p>
        <p>More threads always make a program faster.</p>
      </div>
      <div class="side good" style="--at: var(--b1)">
        <p class="label">Correct</p>
        <p>Threads help only while each one has free work and a free core.</p>
      </div>
    </div>
  </main>
</body>
</html>
